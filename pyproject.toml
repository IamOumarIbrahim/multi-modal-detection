[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mmsar"
version = "1.0.0"
description = "Causal temporal filtering for reliable alerts in dual-stream UAV search and rescue detection"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "ultralytics",
    "opencv-python",
    "imageio-ffmpeg",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]
figures = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
