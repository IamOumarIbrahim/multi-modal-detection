[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mmsar"
version = "0.1.0"
description = "Multi-Modal Search-And-Rescue Detection Pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "ultralytics",
    "opencv-python",
    "pyyaml",
    "typer",
    "label-studio-sdk",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
mmsar = "mmsar.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
