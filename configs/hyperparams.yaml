#   MMSAR - detector training settings (read by scripts/train_full_detectors.py)
#        Oumar Ibrahim U22200741

# these are the exact arguments the paper detectors were trained with
# anything not listed here is left at the ultralytics default
# (optimizer "auto" picks SGD for this run length, amp mixed precision is on)

weights: yolo11n.pt     # COCO pretrained start point, same for both streams
epochs: 60
batch: 16
imgsz: 640
workers: 2
cos_lr: true
lr0: 0.01
lrf: 0.01
seed: 0                 # ultralytics default, written here so it is visible
